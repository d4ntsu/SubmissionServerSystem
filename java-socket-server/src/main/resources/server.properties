# Socket server configuration
server.host=127.0.0.1
server.port=9000

# SQLite database path (relative to java-socket-server working directory, or absolute)
# Points to the same DB used by the Python backend
database.path=../backend/data/exam_system.db

# Internal FastAPI service authentication; set to the same local secret in both processes.
# The server rejects service authentication when this value is blank.
auth.shared_secret=

# User JWT verification; set this to the backend SECRET_KEY. Only HS256 is supported.
auth.jwt_secret=
auth.jwt_algorithm=HS256
