# Socket server configuration
server.host=127.0.0.1
server.port=9000

# SQLite database path (relative to project root, or absolute)
# Points to the same DB used by the Python backend
database.path=../backend/app/data/exam_system.db

# Internal FastAPI service authentication; set to the same local secret in both processes.
# The server rejects service.hello when this value is blank.
auth.shared_secret=
